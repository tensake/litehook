name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target export \
            -o type=local,dest=./output \
            --cache-to type=gha,mode=max \
            .

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ghcr.io/${{ github.repository }}:latest \
            -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            --cache-from type=gha \
            --push \
            .

      - name: Collect binaries
        run: |
          cp ./output/linux_amd64/litehook litehook-x86_64-linux
          cp ./output/linux_arm64/litehook litehook-aarch64-linux

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            litehook-x86_64-linux
            litehook-aarch64-linux
          generate_release_notes: true
